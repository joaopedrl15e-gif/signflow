<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%"燻="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Document Shield Outline -->
  <path d="M 176 130 C 230 115, 282 115, 336 130 C 336 240, 310 330, 256 380 C 202 330, 176 240, 176 130 Z" 
        fill="#0f172a" 
        fill-opacity="0.8"
        stroke="#10b981" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Glowing Checkmark / Signature Feather -->
  <path d="M 215 250 L 245 285 L 305 210" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Sparkle stars -->
  <circle cx="370" cy="150" r="10" fill="#34d399" filter="url(#glow)"/>
  <circle cx="140" cy="320" r="7" fill="#6366f1" filter="url(#glow)"/>

  <!-- Text -->
  <text x="256" y="440" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="42" 
        font-weight="900" 
        letter-spacing="4">
    SIGNFLOW <tspan fill="#10b981">PRO</tspan>
  </text>
</svg>
